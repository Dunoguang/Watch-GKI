name: Sync ReSukiSU submodule

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resukisu
        uses: actions/checkout@v7.0.1
        with:
          ref: resukisu
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch fork sprd-4.4 and compare gitlink
        run: |
          CURRENT=$(git ls-tree HEAD KernelSU | awk '{print $3}')
          echo "current gitlink: $CURRENT"
          # 读 fork 的 sprd-4.4（公开仓库，无需 token）
          git ls-remote https://github.com/Dunoguang/ReSukiSU.git refs/heads/sprd-4.4 > /tmp/sprd_head
          NEW=$(awk '{print $1}' /tmp/sprd_head)
          echo "fork sprd-4.4:  $NEW"
          echo "CURRENT=$CURRENT" >> $GITHUB_ENV
          echo "NEW=$NEW" >> $GITHUB_ENV
          if [ "$CURRENT" = "$NEW" ]; then
            echo "gitlink 已最新，无需更新"
          else
            echo "sprd-4.4 有更新 → 将 bump gitlink 触发构建"
          fi

      - name: Bump gitlink and push (triggers build)
        if: env.CURRENT != env.NEW
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git -C KernelSU fetch https://github.com/Dunoguang/ReSukiSU.git sprd-4.4
          git -C KernelSU checkout --detach ${{ env.NEW }}
          git add KernelSU
          git commit -m "submodule: bump ReSukiSU sprd-4.4 to ${{ env.NEW }} (auto sync)"
          git push origin resukisu
