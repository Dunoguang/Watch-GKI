name: Build Kernel

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # ccache tuning: keep cache across runners, ignore abs-path hash, compress
    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      # No compression (default): compressed cache forces zstd decompress on
      # every hit (~82s). Uncompressed + hardlink = near-instant cache hits.
      CCACHE_NOCOMPRESS: "true"
      CCACHE_DIR: /home/runner/.ccache  # force cache dir to match actions/cache path

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Update ReSukiSU submodule to latest main
        run: |
          # 修复: submodule 的 .git 是文件(gitdir 指针), Kbuild 的 shallow 自救逻辑失效,
          # 必须手动 unshallow, 否则 rev-list --count 恒为 1 -> version code 恒 30701
          git -C KernelSU fetch --unshallow origin
          git -C KernelSU fetch origin main
          git -C KernelSU checkout --detach origin/main
          echo "ReSukiSU HEAD: $(git -C KernelSU log -1 --format='%h %s')"

      - name: Apply ReSukiSU 4.4 customizations
        run: |
          # 应用 4.4 定制补丁（剥离 Tracepoint、SUSFS 解耦、Manual Hook 优先）
          git -C KernelSU apply --whitespace=nowarn ../tools/patches/resukisu-4.4.patch
          echo "✅ ReSukiSU 4.4 patch applied"
          grep -n "CONFIG_KSU_MANUAL_HOOK" KernelSU/kernel/Kconfig | head -2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libssl-dev ccache

      # Restore + save ccache separately (official docs; save-always is deprecated).
      # Key bound to defconfig only -> editing workflow won't invalidate cache.
      - name: Restore ccache
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          aarch64-linux-gnu-gcc --version
          ccache --version
          mkdir -p ~/.ccache
          ccache -M 4G
          ccache -z
          echo "ccache cache_dir: $(ccache --show-config | grep cache_dir)"

      - name: Generate .config
        id: config
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_dw99_defconfig
          scripts/config --enable  CONFIG_SECCOMP
          scripts/config --enable  CONFIG_SECCOMP_FILTER

          # KernelSU built into kernel
          echo "::notice::✅ KernelSU mode (default)"
          scripts/config --enable  CONFIG_KSU
          scripts/config --disable CONFIG_KSU_KPROBES_KSUD
          scripts/config --disable CONFIG_KPROBES
          scripts/config --disable CONFIG_KRETPROBES
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel + DTB
        run: |
          echo "::group::Building kernel Image + dw99.dtb"
          # NOTE: CC is hard-coded in Makefile as $(CROSS_COMPILE)gcc (= overrides env),
          # so ccache MUST go into CROSS_COMPILE (?= respects env), not CC.
          export CROSS_COMPILE="ccache aarch64-linux-gnu-"
          make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" -j$(nproc) Image sprd/dw99.dtb 2>&1 | tee /tmp/build.log
          echo "::endgroup::"
          echo "::notice::✅ Build complete at $(date)"

      # Show ccache effectiveness after build
      - name: Report ReSukiSU version
        run: |
          VCODE=$(grep -oE "ReSukiSU version code: [0-9]+" /tmp/build.log | head -1 | awk '{print $NF}')
          VNAME=$(grep -oE "ReSukiSU version name: .+" /tmp/build.log | head -1 | sed 's/.*name: //')
          HOOK=$(grep -oE "ReSukiSU: using [A-Za-z ]+Hook" /tmp/build.log | head -1 | sed 's/.*using //')
          { echo "## 🚀 ReSukiSU 版本"; echo ""; echo "- **Version code**: $VCODE"; echo "- **Version name**: $VNAME"; echo "- **Hook method**: $HOOK"; echo "- **Kernel**: $(grep -oE 'Kernel: [^ ]+' /tmp/build.log | head -1 | awk '{print $NF}')"; } >> "$GITHUB_STEP_SUMMARY"
          echo "ReSukiSU vcode=$VCODE name=$VNAME hook=$HOOK"

      - name: ccache stats
        run: |
          ccache -s
          HITS=$(ccache -s | awk '/Hits/ {print $2; exit}')
          MISSES=$(ccache -s | awk '/Misses/ {print $2; exit}')
          { echo "## 📊 ccache 缓存统计"; echo ""; echo "\`\`\`"; ccache -s; echo "\`\`\`"; echo ""; echo "Hits: $HITS / Misses: $MISSES"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package boot.img
        run: |
          python3 tools/mkbootimg.py

      - name: Verify output
        run: |
          ls -lh boot.img arch/arm64/boot/Image arch/arm64/boot/dts/sprd/dw99.dtb
          file arch/arm64/boot/Image

      # Always save latest ccache state (per docs: always() + restore output key)
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ccache
          # unique key per run -> always saves successfully; restore finds it via prefix
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-${{ github.run_id }}

      - name: Upload boot.img
        uses: actions/upload-artifact@v7.0.1
        with:
          name: boot.img-${{ steps.config.outputs.patch }}
          path: boot.img
