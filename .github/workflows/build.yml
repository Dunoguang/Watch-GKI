name: Build Kernel

on:
  push:
    branches: [ lineage-17.1 ]
    tags-ignore: [ '**' ]
  workflow_dispatch:
    inputs:
      enable_ksu:
        description: 'Enable KernelSU (KSU) in kernel'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    # ccache tuning: keep cache across runners, ignore abs-path hash
    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libssl-dev ccache

      # Cache key is derived from real build inputs (defconfig + workflow),
      # so config changes produce a new cache while unchanged configs hit it.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig', '.github/workflows/build.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          aarch64-linux-gnu-gcc --version
          ccache --version
          ccache -M 4G
          ccache -z

      - name: Generate .config
        id: config
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_dw99_defconfig
          scripts/config --enable  CONFIG_SECCOMP
          scripts/config --enable  CONFIG_SECCOMP_FILTER

          # KSU switch: manual dispatch can toggle; push defaults to enabled
          if [ "${{ github.event.inputs.enable_ksu }}" = "false" ]; then
            echo "::notice::🚫 KernelSU DISABLED (manual choice)"
            echo "ksu=noksu" >> "$GITHUB_OUTPUT"
            scripts/config --disable CONFIG_KSU
          else
            echo "::notice::✅ KernelSU ENABLED (default)"
            echo "ksu=ksu" >> "$GITHUB_OUTPUT"
            scripts/config --enable  CONFIG_KSU
          fi
          scripts/config --disable CONFIG_KPROBES
          scripts/config --disable CONFIG_KRETPROBES
          scripts/config --disable CONFIG_KSU_KPROBES_KSUD
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel + DTB
        run: |
          echo "::group::Building kernel Image + dw99.dtb"
          set -o pipefail
          export CC="ccache aarch64-linux-gnu-gcc"
          stdbuf -oL -eL make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image sprd/dw99.dtb 2>&1 | while IFS= read -r line; do
            echo "$line"
            : $((i=i+1))
            if [ $((i % 50)) -eq 0 ]; then
              echo "::notice::🔨 compiled $i files so far..." >&2
            fi
          done
          echo "::endgroup::"
          echo "::notice::✅ Build complete at $(date)"

      # Show ccache effectiveness after build
      - name: ccache stats
        run: |
          ccache -s
          HITS=$(ccache -s | awk '/Hits/ {print $2; exit}')
          MISSES=$(ccache -s | awk '/Misses/ {print $2; exit}')
          { echo "## 📊 ccache 缓存统计"; echo ""; echo "\`\`\`"; ccache -s; echo "\`\`\`"; echo ""; echo "Hits: $HITS / Misses: $MISSES"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package boot.img
        run: python3 tools/mkbootimg.py

      - name: Verify output
        run: |
          ls -lh boot.img arch/arm64/boot/Image arch/arm64/boot/dts/sprd/dw99.dtb
          file arch/arm64/boot/Image

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot.img-${{ steps.config.outputs.ksu }}
          path: boot.img
