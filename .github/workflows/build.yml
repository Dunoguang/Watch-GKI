name: Build Kernel

on:
  push:
    branches: [ lineage-17.1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libssl-dev

      - name: Verify toolchain
        run: aarch64-linux-gnu-gcc --version

      - name: Generate .config
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_dw99_defconfig
          scripts/config --enable  CONFIG_SECCOMP
          scripts/config --enable  CONFIG_SECCOMP_FILTER
          scripts/config --enable  CONFIG_KSU
          scripts/config --disable CONFIG_KPROBES
          scripts/config --disable CONFIG_KRETPROBES
          scripts/config --disable CONFIG_KSU_KPROBES_KSUD
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel
        run: |
          echo "::group::Starting build at $(date)"
          # Stream unbuffered output so GitHub UI shows live logs
          set -o pipefail
          stdbuf -oL -eL make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image 2>&1 | while IFS= read -r line; do
            echo "$line"
            : $((i=i+1))
            if [ $((i % 50)) -eq 0 ]; then
              echo "::notice::🔨 compiled $i files so far..." >&2
            fi
          done
          echo "::endgroup::"
          echo "::notice::✅ Build complete at $(date)"

      - name: Verify output
        run: |
          ls -lh arch/arm64/boot/Image
          file arch/arm64/boot/Image

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image
          path: arch/arm64/boot/Image
