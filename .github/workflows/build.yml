name: Build Kernel

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  workflow_dispatch:
    inputs:
      include_resukisu:
        description: '编入 ReSukiSU + SuSFS（同时开启/关闭，默认开启）'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    # ccache tuning: keep cache across runners, ignore abs-path hash, compress
    env:
      CCACHE_MAXSIZE: 4G
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      # No compression (default): compressed cache forces zstd decompress on
      # every hit (~82s). Uncompressed + hardlink = near-instant cache hits.
      CCACHE_NOCOMPRESS: "true"
      CCACHE_DIR: /home/runner/.ccache  # force cache dir to match actions/cache path

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      # ============ 整个工作区缓存（含 out/ 编译产物，增量编译核心）============
      - name: Restore workspace (with build output)
        id: ws-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ github.workspace }}
            !${{ github.workspace }}/.git
          key: ws-wg-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ws-wg-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-
            ws-wg-${{ runner.os }}-

      - name: Update repo to latest
        run: |
          git fetch origin
          git reset --hard origin/main
          # 清理缓存恢复的子模块脏状态（detach + patch 修改 + untracked），再同步到 gitlink
          git submodule foreach --recursive 'git reset --hard HEAD; git clean -fdx' 2>/dev/null || true
          git submodule update --init --recursive

      - name: Update ReSukiSU submodule to latest main
        if: inputs.include_resukisu != 'false'
        run: |
          # 修复: submodule 的 .git 是文件(gitdir 指针), Kbuild 的 shallow 自救逻辑失效,
          # 必须手动 unshallow, 否则 rev-list --count 恒为 1 -> version code 恒 30701
          # workspace 缓存恢复后子模块可能是完整仓库，unshallow 需条件判断
          if git -C KernelSU rev-parse --is-shallow-repository 2>/dev/null | grep -q true; then
            git -C KernelSU fetch --unshallow origin
          fi
          git -C KernelSU fetch origin main
          git -C KernelSU checkout --detach origin/main
          echo "ReSukiSU HEAD: $(git -C KernelSU log -1 --format='%h %s')"

      - name: Apply ReSukiSU 4.4 customizations
        if: inputs.include_resukisu != 'false'
        run: |
          # 应用 4.4 定制补丁（剥离 Tracepoint、SUSFS 解耦、Manual Hook 优先）
          git -C KernelSU apply --whitespace=nowarn ../tools/patches/resukisu-4.4.patch
          echo "✅ ReSukiSU 4.4 patch applied"
          grep -n "CONFIG_KSU_MANUAL_HOOK" KernelSU/kernel/Kconfig | head -2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu flex bison bc libssl-dev ccache

      # Restore + save ccache separately (official docs; save-always is deprecated).
      # Key bound to defconfig only -> editing workflow won't invalidate cache.
      - name: Restore ccache
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-
            ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          aarch64-linux-gnu-gcc --version
          ccache --version
          mkdir -p ~/.ccache
          ccache -M 4G
          ccache -z
          echo "ccache cache_dir: $(ccache --show-config | grep cache_dir)"

      - name: Generate .config
        id: config
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- lineageos_dw99_defconfig
          scripts/config --enable  CONFIG_SECCOMP
          scripts/config --enable  CONFIG_SECCOMP_FILTER

          if [ "${{ inputs.include_resukisu }}" != "false" ]; then
            # ReSukiSU + SuSFS 编入（默认，push 触发同样保持）
            echo "::notice::✅ ReSukiSU + SuSFS 编入 (default)"
            scripts/config --enable  CONFIG_KSU
            scripts/config --disable CONFIG_KSU_KPROBES_KSUD
            scripts/config --disable CONFIG_KPROBES
            scripts/config --disable CONFIG_KRETPROBES
          else
            # 手动选择不编入：KSU_SUSFS/MANUAL_HOOK 的 depends 不含 KSU，
            # olddefconfig 清不掉，必须显式 disable（SUSFS 子项/MULTI_MANAGER 会连锁清除）
            echo "::notice::🚫 不编入 ReSukiSU + SuSFS (manual dispatch)"
            scripts/config --disable CONFIG_KSU
            scripts/config --disable CONFIG_KSU_MANUAL_HOOK
            scripts/config --disable CONFIG_KSU_SUSFS
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel + DTB
        run: |
          echo "::group::Building kernel Image + dw99.dtb"
          # NOTE: CC is hard-coded in Makefile as $(CROSS_COMPILE)gcc (= overrides env),
          # so ccache MUST go into CROSS_COMPILE (?= respects env), not CC.
          export CROSS_COMPILE="ccache aarch64-linux-gnu-"
          set -o pipefail  # make 失败时管道退出码不再被 tee 吞掉
          make ARCH=arm64 CROSS_COMPILE="ccache aarch64-linux-gnu-" -j$(nproc) Image sprd/dw99.dtb 2>&1 | tee /tmp/build.log
          echo "::endgroup::"
          echo "::notice::✅ Build complete at $(date)"

      # Show ccache effectiveness after build
      - name: Report ReSukiSU version
        if: inputs.include_resukisu != 'false'
        run: |
          VCODE=$(grep -oE "ReSukiSU version code: [0-9]+" /tmp/build.log | head -1 | awk '{print $NF}')
          VNAME=$(grep -oE "ReSukiSU version name: .+" /tmp/build.log | head -1 | sed 's/.*name: //')
          HOOK=$(grep -oE "ReSukiSU: using [A-Za-z ]+Hook" /tmp/build.log | head -1 | sed 's/.*using //')
          SUSVER=$(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h | cut -d'"' -f2)
          { echo "## 🚀 ReSukiSU 版本"; echo ""; echo "- **Version code**: $VCODE"; echo "- **Version name**: $VNAME"; echo "- **Hook method**: $HOOK"; echo "- **SuSFS version**: $SUSVER"; echo "- **Kernel**: $(grep -oE 'KERNEL_VERSION: [^ ]+' /tmp/build.log | head -1 | awk '{print $NF}')"; } >> "$GITHUB_STEP_SUMMARY"
          echo "ReSukiSU vcode=$VCODE name=$VNAME hook=$HOOK susver=$SUSVER"
          echo "vcode=$VCODE" >> "$GITHUB_ENV"
          echo "susver=$SUSVER" >> "$GITHUB_ENV"

      - name: ccache stats
        run: |
          ccache -s
          HITS=$(ccache -s | awk '/Hits/ {print $2; exit}')
          MISSES=$(ccache -s | awk '/Misses/ {print $2; exit}')
          { echo "## 📊 ccache 缓存统计"; echo ""; echo "\`\`\`"; ccache -s; echo "\`\`\`"; echo ""; echo "Hits: $HITS / Misses: $MISSES"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package boot.img
        run: |
          python3 tools/mkbootimg.py

      - name: Rename artifact (WGKI naming)
        run: |
          TS=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          if [ "${{ inputs.include_resukisu }}" != "false" ]; then
            ARTIFACT="WGKI-RSSU${vcode}-SuSFS${susver}-SAR-DM-EROFS-ByDunoguang-${TS}"
          else
            ARTIFACT="WGKI-NOKSU-SAR-DM-EROFS-ByDunoguang-${TS}"
          fi
          mv boot.img "${ARTIFACT}.img"
          echo "artifact=$ARTIFACT" >> "$GITHUB_ENV"
          echo "::notice::✅ 产物: ${ARTIFACT}.img"

      - name: Verify output
        run: |
          ls -lh ${artifact}.img arch/arm64/boot/Image arch/arm64/boot/dts/sprd/dw99.dtb
          file arch/arm64/boot/Image

      # Always save latest ccache state (per docs: always() + restore output key)
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ccache
          # unique key per run -> always saves successfully; restore finds it via prefix
          key: ccache-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-${{ github.run_id }}

      # ============ 保存整个工作区（含编译产物，供下次增量编译）============
      - name: Save workspace (with build output)
        if: always()
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ${{ github.workspace }}
            !${{ github.workspace }}/.git
          key: ws-wg-${{ runner.os }}-${{ hashFiles('arch/arm64/configs/lineageos_dw99_defconfig') }}-${{ github.run_id }}

      - name: Upload boot.img
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}.img

      # ============ AnyKernel3 附加产出 (osm0sis/AnyKernel3 刷机 zip) ============
      # 只替换 kernel 段, ramdisk/SPRD-wrapped DTB 原样保留; 失败不阻断 boot.img 主产物
      - name: Checkout AnyKernel3
        uses: actions/checkout@v7.0.1
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Package AnyKernel3 zip
        run: |
          command -v zip >/dev/null || sudo apt-get install -y zip
          cat > AnyKernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Watch-GKI for DW99 (SL8541e) by Dunoguang
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=/dev/block/platform/soc/soc:ap-ahb/20600000.sdio/by-name/boot;  # DW99 实测路径（recovery 下唯一存在形态）
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          ## end boot install
          EOF
          cp arch/arm64/boot/Image AnyKernel3/Image
          cd AnyKernel3
          ZIP="${artifact}-AK3.zip"
          zip -r9 "$ZIP" * -x .git README.md '*placeholder'
          cd ..
          mv "AnyKernel3/$ZIP" .
          echo "ak3_zip=$ZIP" >> "$GITHUB_ENV"
          echo "::notice::✅ AnyKernel3 产物: ${ZIP} ($(du -h "$ZIP" | cut -f1))"
          unzip -l "$ZIP" | grep -E "Image|anykernel.sh"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ak3_zip }}
          path: ${{ env.ak3_zip }}

      - name: ☁️ 上传 AnyKernel3 到 Tempfile
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f "${ak3_zip}" ]; then
            echo "⚠️ AK3 zip 不存在，跳过 Tempfile 上传" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          RESP=$(curl -sS -X POST https://tempfile.org/api/upload/local \
            -F "files=@${ak3_zip}" -F "expiryHours=48")
          URL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['files'][0]['url'] + 'download')")
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ☁️ AnyKernel3 Tempfile 下载
          | 📦 产物 | 🔗 链接 | 📏 大小 | ⏰ 有效期 |
          |---------|---------|---------|-----------|
          | ${ak3_zip} | [点击下载](${URL}) | $(du -h "$ak3_zip" | cut -f1) | 48 小时 |

          > \`${URL}\`
          EOF
          echo "AK3_TEMP_URL=${URL}"

      # 参考 Re-Vibe-Launcher: 同时上传 Tempfile, 无论构建成败都执行, 失败不阻断
      - name: ☁️ 上传到 Tempfile (无论成败)
        if: always()
        continue-on-error: true
        run: |
          FILE="${artifact}.img"
          if [ ! -f "$FILE" ]; then
            echo "⚠️ 产物不存在 (${FILE})，跳过 Tempfile 上传" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "📤 上传 ${FILE} 到 Tempfile..."
          RESP=$(curl -sS -X POST https://tempfile.org/api/upload/local \
            -F "files=@${FILE}" -F "expiryHours=48")
          URL=$(echo "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['files'][0]['url'] + 'download')")
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ☁️ Tempfile 下载
          | 📦 产物 | 🔗 链接 | 📏 大小 | ⏰ 有效期 |
          |---------|---------|---------|-----------|
          | ${FILE} | [点击下载](${URL}) | $(du -h "$FILE" | cut -f1) | 48 小时 |

          > \`${URL}\`
          EOF
          echo "TEMP_URL=${URL}"
